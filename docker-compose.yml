services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.example
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  securemark:
    build: .
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - securemark-data:/data
      - ./data:/legacy-data:ro
    restart: unless-stopped
volumes:
  postgres-data:
  securemark-data:

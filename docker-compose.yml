services:
  securemark:
    build: .
    pull_policy: build
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Neon connection string}
    ports:
      - "3000:3000"
    volumes:
      - securemark-data:/data
      - ./data:/legacy-data:ro
    restart: unless-stopped

volumes:
  securemark-data: